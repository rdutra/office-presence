<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">94.7 FM Concierto sticker</title>
  <desc id="desc">Retro red and white Concierto FM 94.7 logo-style sticker.</desc>
  <defs>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#160708" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="22" y="22" width="856" height="346" rx="14" fill="#f7f2e8"/>
    <rect x="54" y="52" width="792" height="286" rx="4" fill="#cc171d" filter="url(#paper)"/>
    <rect x="54" y="204" width="792" height="10" fill="#f7f2e8"/>
    <rect x="78" y="72" width="744" height="246" fill="none" stroke="#f7f2e8" stroke-width="3" opacity="0.78"/>
    <text x="450" y="177" fill="#fffaf1" font-family="Arial Black, Impact, sans-serif" font-size="136" font-weight="900" letter-spacing="-7" text-anchor="middle">94.7 FM</text>
    <text x="450" y="296" fill="#fffaf1" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="800" letter-spacing="27" text-anchor="middle">CONCIERTO</text>
  </g>
</svg>
