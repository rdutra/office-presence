<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Office Presence Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .loading {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 1.2rem;
      opacity: 0.85;
    }

    .error {
      display: none;
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid rgba(239, 68, 68, 0.5);
      border-radius: 0.5rem;
      padding: 1rem;
      margin: 0 0 1rem 0;
      text-align: center;
    }

    /* Firebase embed overrides */
    body {
      overflow-y: auto;
    }

    .container {
      height: auto;
      min-height: calc(100vh - 2rem);
    }

    @media (max-width: 768px) {
      .container {
        min-height: auto;
        padding-bottom: 2rem;
      }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading">Loading dashboard data...</div>
  <div id="error" class="error"></div>

  <div class="container" id="dashboard" style="display: none;">
    <header>
      <span class="current-time" id="current-time" data-utc="">--:--</span>
      <h1>🏢 Who's Here Today</h1>
      <div class="date" id="current-date">Loading...</div>
    </header>

    <div class="stats">
      <div class="stat-card" data-stat="present">
        <div class="stat-number" id="present-count">0</div>
        <div class="stat-label">In the Office 🎉</div>
      </div>
      <div class="stat-card" data-stat="total">
        <div class="stat-number" id="total-people">0</div>
        <div class="stat-label">Registered Users 👥</div>
      </div>
      <div class="stat-card" data-stat="daily-record">
        <div class="stat-number" id="daily-record">0</div>
        <div class="stat-label">Today's Record 🏆</div>
      </div>
      <div class="stat-card" data-stat="all-time-record">
        <div class="stat-number" id="all-time-record">0</div>
        <div class="stat-label">All-Time Record 🌟</div>
      </div>
    </div>

    <div class="columns">
      <div class="column">
        <div class="section-header">
          <span class="icon">👥</span> In the Office
        </div>
        <div id="present-section-body">
          <div class="empty-state">Loading...</div>
        </div>
      </div>

      <div class="right-column-sections">
        <div class="right-section">
          <div class="section-header">
            <div class="section-title">
              <span class="icon">🏆</span> This Week's Champions
            </div>
            <div class="section-meta">
              <span class="week-range" data-week-range>-- to --</span>
            </div>
          </div>
          <div class="last-week-winner" data-last-week-winner>
            <div class="badge-empty">Loading...</div>
          </div>
          <div id="champions-section-body">
            <div class="empty-state">Loading...</div>
          </div>
        </div>

        <div class="right-section">
          <div class="section-header">
            <span class="icon">📅</span> Earlier Today
          </div>
          <div id="earlier-section-body">
            <div class="empty-state">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // IMPORTANT: Replace these placeholders with your actual Firebase config
    // Get your config from: Firebase Console > Project Settings > General > Your apps
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY_HERE",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const dashboardEl = document.getElementById('dashboard');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const currentTimeEl = document.getElementById('current-time');
    const currentDateEl = document.getElementById('current-date');
    const presentSection = document.getElementById('present-section-body');
    const championsSection = document.getElementById('champions-section-body');
    const earlierSection = document.getElementById('earlier-section-body');
    const presentCountEl = document.getElementById('present-count');
    const totalPeopleEl = document.getElementById('total-people');
    const dailyRecordEl = document.getElementById('daily-record');
    const allTimeRecordEl = document.getElementById('all-time-record');
    const weekRangeEl = document.querySelector('[data-week-range]');
    const lastWeekWinnerEl = document.querySelector('[data-last-week-winner]');

    const medals = ['🥇', '🥈', '🥉'];

    function showDashboard() {
      loadingEl.style.display = 'none';
      errorEl.style.display = 'none';
      dashboardEl.style.display = 'flex';
      dashboardEl.style.flexDirection = 'column';
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      dashboardEl.style.display = 'none';
      loadingEl.style.display = 'none';
    }

    function normalizeUtc(value) {
      if (!value) return null;
      return value.includes('Z') || value.includes('+') ? value : `${value}Z`;
    }

    function formatClock(utcString) {
      const normalized = normalizeUtc(utcString);
      if (!normalized) return '--:--';
      const date = new Date(normalized);
      if (Number.isNaN(date.getTime())) return '--:--';
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    function formatDisplayDate(utcString) {
      const normalized = normalizeUtc(utcString);
      const date = normalized ? new Date(normalized) : new Date();
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });
    }

    function renderPresent(people) {
      if (!Array.isArray(people) || people.length === 0) {
        return '<div class="empty-state">No one here yet — be the first! ☕</div>';
      }

      const cards = people.map((person) => {
        const name = person?.person || 'Unknown';
        const device = person?.device || 'Device';
        const status = person?.status || 'inactive';
        const initial = name.trim().charAt(0).toUpperCase() || '?';

        return `
            <div class="person-card status-${status}">
              <div class="person-avatar">${initial}</div>
              <div class="person-info">
                <div class="person-name">${name}</div>
                <div class="person-device">${device}</div>
              </div>
            </div>
          `;
      }).join('');

      return `<div class="people-list">${cards}</div>`;
    }

    function renderChampions(attendees) {
      if (!Array.isArray(attendees) || attendees.length === 0) {
        return '<div class="empty-state">No data yet</div>';
      }

      const podium = attendees.slice(0, 3).map((attendee, index) => {
        const name = attendee?.person || 'Unknown';
        const days = attendee?.days || 0;
        return `
            <div class="podium-item rank-${index + 1}">
              <div class="podium-rank">${medals[index] || ''}</div>
              <div class="podium-info">
                <div class="podium-name">${name}</div>
                <div class="podium-days">${days} days</div>
              </div>
            </div>
          `;
      }).join('');

      return `<div class="podium-container">${podium}</div>`;
    }

    function renderLastWeekWinner(winner) {
      if (!winner) {
        return '<div class="badge-empty">No winner recorded last week</div>';
      }

      const name = winner.person || 'Unknown';
      const days = winner.days ?? 0;
      const start = winner.week_start || '--';
      const end = winner.week_end || '--';

      return `
          <div class="badge-label">Last Week</div>
          <div class="badge-name">${name}</div>
          <div class="badge-meta">${days} days (${start} to ${end})</div>
        `;
    }

    function renderEarlierToday(absent) {
      if (!Array.isArray(absent) || absent.length === 0) {
        return '<div class="empty-state">No one has left yet</div>';
      }

      const recent = absent.slice(0, 8).map((person) => {
        const name = person?.person || 'Unknown';
        return `
            <div class="recent-item">
              <div class="recent-name">${name}</div>
            </div>
          `;
      }).join('');

      return `<div class="recent-list" id="recent-list-auto-scroll">${recent}</div>`;
    }

    // Auto-scroll functionality for "Earlier Today" section
    let autoScrollInterval = null;

    function initializeAutoScroll(element) {
      if (!element) return;

      // Clear any existing interval
      if (autoScrollInterval) {
        clearInterval(autoScrollInterval);
        autoScrollInterval = null;
      }

      // Only auto-scroll if content overflows
      const hasOverflow = element.scrollHeight > element.clientHeight;
      if (!hasOverflow) return;

      let scrollingDown = true;
      const scrollStep = 1; // pixels per step
      const scrollDelay = 50; // milliseconds between steps
      const pauseAtEnd = 2000; // pause at top/bottom in milliseconds

      autoScrollInterval = setInterval(() => {
        const atBottom = element.scrollTop + element.clientHeight >= element.scrollHeight - 1;
        const atTop = element.scrollTop <= 1;

        if (scrollingDown) {
          if (atBottom) {
            // Pause at bottom, then reverse direction
            setTimeout(() => {
              scrollingDown = false;
            }, pauseAtEnd);
          } else {
            element.scrollTop += scrollStep;
          }
        } else {
          if (atTop) {
            // Pause at top, then reverse direction
            setTimeout(() => {
              scrollingDown = true;
            }, pauseAtEnd);
          } else {
            element.scrollTop -= scrollStep;
          }
        }
      }, scrollDelay);
    }

    function updateDashboard(data) {
      if (!data) {
        showError('No data available. Make sure the sync script is running.');
        return;
      }

      showDashboard();

      const nowUtc = data.now || data.last_updated;
      currentTimeEl.dataset.utc = normalizeUtc(nowUtc) || '';
      currentTimeEl.textContent = formatClock(nowUtc);
      currentDateEl.textContent = formatDisplayDate(nowUtc);

      presentCountEl.textContent = data.present_count ?? 0;
      totalPeopleEl.textContent = data.total_people ?? 0;
      dailyRecordEl.textContent = data.daily_record ?? 0;
      allTimeRecordEl.textContent = data.all_time_record ?? 0;

      if (weekRangeEl && data.current_week_start && data.current_week_end) {
        weekRangeEl.textContent = `${data.current_week_start} to ${data.current_week_end}`;
      }

      if (lastWeekWinnerEl) {
        lastWeekWinnerEl.innerHTML = renderLastWeekWinner(data.last_week_winner);
      }

      presentSection.innerHTML = renderPresent(data.mapped_present);
      championsSection.innerHTML = renderChampions(data.top_attendees);
      earlierSection.innerHTML = renderEarlierToday(data.mapped_absent);

      // Initialize auto-scroll for the Earlier Today section
      const recentList = document.getElementById('recent-list-auto-scroll');
      if (recentList) {
        initializeAutoScroll(recentList);
      }
    }

    const dashboardRef = ref(database, 'dashboard');
    onValue(dashboardRef, (snapshot) => {
      updateDashboard(snapshot.val());
    }, (error) => {
      console.error('Firebase error:', error);
      showError(`Error loading data: ${error.message}`);
    });
  </script>
</body>

</html>
